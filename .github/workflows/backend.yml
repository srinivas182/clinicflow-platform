name: Backend

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - 'pint.json'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - 'pint.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # commit a generated composer.lock back to the PR branch
  pull-requests: write   # post a failure report on the PR
  statuses: write        # publish the test summary as a commit status

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinicflow_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: clinicflow_platform
      DB_USERNAME: root
      DB_PASSWORD: root
      HUB_DB_DATABASE: clinicflow_hub

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, bcmath, pcntl, posix, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: |
          if [ -f composer.lock ] && composer validate --no-check-all --no-check-publish --strict >/dev/null 2>&1; then
            composer install --no-interaction --prefer-dist --no-progress
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ -f composer.lock ]; then
            # composer.json gained or changed a requirement: refresh only what changed.
            composer update --no-interaction --prefer-dist --no-progress --minimal-changes
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            composer update --no-interaction --prefer-dist --no-progress
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated composer.lock
        if: steps.install.outputs.generated == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(deps): update composer.lock generated by CI"
          git push origin HEAD:${{ github.head_ref }}

      - name: Create Network Hub database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS clinicflow_hub CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test 2>&1 | tee .ci-pint.txt

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G 2>&1 | tee .ci-phpstan.txt

      - name: Pest
        run: vendor/bin/pest --ci 2>&1 | tee .ci-pest.txt

      - name: Publish test summary
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(grep -E "Tests:" .ci-pest.txt | tail -1 | sed 's/\x1b\[[0-9;]*m//g' | xargs)
          sha=$(git rev-parse HEAD)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=success -f context="backend/tests" -f description="${summary:0:140}"

      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Backend CI failed — \`${GITHUB_SHA::8}\`"
            for f in .ci-pint.txt .ci-phpstan.txt .ci-pest.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>${f}</summary>"
                echo ""
                echo '```'
                tail -n 120 "$f"
                echo '```'
                echo "</details>"
              fi
            done
          } > .ci-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file .ci-report.md
