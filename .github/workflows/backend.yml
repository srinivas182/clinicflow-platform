name: Backend

# Minutes-saving rules (GitHub Actions minutes are limited):
# - draft PRs run only lint + static analysis (~1 min);
# - the full test suite runs once a PR is ready for review (or is marked ready);
# - pushes to main (after a merge) run only lint + static analysis — the same code already passed on the PR;
# - a newer push cancels the older run; unrelated file changes don't trigger this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - 'pint.json'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - 'pint.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # commit a generated composer.lock back to the PR branch
  pull-requests: write   # post a failure report on the PR
  statuses: write        # publish the test summary as a commit status

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, bcmath, pcntl, posix, zip, gd
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: |
          if [ -f composer.lock ] && composer validate --no-check-all --no-check-publish --strict >/dev/null 2>&1; then
            composer install --no-interaction --prefer-dist --no-progress
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ -f composer.lock ]; then
            # composer.json gained or changed a requirement: refresh only what changed.
            composer update --no-interaction --prefer-dist --no-progress --minimal-changes
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            composer update --no-interaction --prefer-dist --no-progress
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated composer.lock
        if: steps.install.outputs.generated == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(deps): update composer.lock generated by CI"
          git push origin HEAD:${{ github.head_ref }}

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test 2>&1 | tee .ci-pint.txt

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G 2>&1 | tee .ci-phpstan.txt

      - name: Dependency vulnerabilities (Composer)
        run: composer audit --locked --no-interaction --abandoned=ignore

      - name: Report failure on the pull request
        if: (failure() || cancelled()) && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Backend CI failed (lint / static analysis) — \`${GITHUB_SHA::8}\`"
            for f in .ci-pint.txt .ci-phpstan.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>${f}</summary>"
                echo ""
                echo '```'
                tail -n 120 "$f"
                echo '```'
                echo "</details>"
              fi
            done
          } > .ci-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file .ci-report.md

  tests:
    # The suite is split across 4 runners, each with its own machine and MySQL.
    # Only for ready (non-draft) PRs, or when run by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Tests (part ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinicflow_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: clinicflow_platform
      DB_USERNAME: root
      DB_PASSWORD: root
      HUB_DB_DATABASE: clinicflow_hub

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, bcmath, pcntl, posix, zip, gd
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f composer.lock ] && composer validate --no-check-all --no-check-publish --strict >/dev/null 2>&1; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress --minimal-changes
          fi

      - name: Create Network Hub database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS clinicflow_hub CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pest
        # Stops a stuck run with time left to report it.
        timeout-minutes: 25
        run: vendor/bin/pest --ci --shard=${{ matrix.shard }}/4 --log-events-text .ci-events.txt 2>&1 | tee .ci-pest.txt

      - name: Save this part's result
        if: success()
        run: grep -E "Tests:" .ci-pest.txt | tail -1 | sed 's/\x1b\[[0-9;]*m//g' > ci-summary-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: test-summary-${{ matrix.shard }}
          path: ci-summary-${{ matrix.shard }}.txt

      - name: Report failure on the pull request
        if: (failure() || cancelled()) && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ job.status }}" = "cancelled" ]; then
              echo "### Backend CI cancelled (tests part ${{ matrix.shard }} of 4, superseded) — \`${GITHUB_SHA::8}\`"
            else
              echo "### Backend CI failed (tests part ${{ matrix.shard }} of 4) — \`${GITHUB_SHA::8}\`"
            fi
            if [ -s .ci-pest.txt ] && grep -q "FAILED" .ci-pest.txt; then
              echo ""
              echo "**First failure** (test name and error):"
              echo ""
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' .ci-pest.txt | grep -m1 -A 30 "FAILED" | cut -c1-240
              echo '```'
            fi
            if [ -s .ci-events.txt ]; then
              echo ""
              echo "<details><summary>Last tests started (shows where a stuck run stopped)</summary>"
              echo ""
              echo '```'
              grep -E "Test (Prepared|Started)" .ci-events.txt | tail -n 15 | cut -c1-220
              echo '```'
              echo "</details>"
            fi
            for f in .ci-pest.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>${f}</summary>"
                echo ""
                echo '```'
                tail -n 120 "$f"
                echo '```'
                echo "</details>"
              fi
            done
          } > .ci-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file .ci-report.md

  summary:
    name: Test summary
    needs: [quality, tests]
    if: success() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-summary-*
          merge-multiple: true

      - name: Publish total
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat ci-summary-*.txt
          passed=$(grep -ohE "[0-9]+ passed" ci-summary-*.txt | awk '{s+=$1} END {print s+0}')
          assertions=$(grep -ohE "[0-9]+ assertions" ci-summary-*.txt | awk '{s+=$1} END {print s+0}')
          sha=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=success -f context="backend/tests" -f description="Tests: ${passed} passed (${assertions} assertions)"
