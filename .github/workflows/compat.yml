name: Compatibility

# Manual only (protects Actions minutes): run before major upgrades and when hosting changes.
# Full test suite on MariaDB 10.11 (Afrihost cPanel) with PHP 8.4, and on MySQL 8.4 with PHP 8.5.
on:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} + ${{ matrix.db }} (part ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        shard: [1, 2, 3, 4]
        include:
          - php: '8.4'
            db: 'mariadb:10.11'
          - php: '8.5'
            db: 'mysql:8.4'

    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinicflow_platform
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: clinicflow_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: clinicflow_platform
      DB_USERNAME: root
      DB_PASSWORD: root
      HUB_DB_DATABASE: clinicflow_hub

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, intl, bcmath, pcntl, posix, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create Network Hub database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS clinicflow_hub CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pest
        run: vendor/bin/pest --ci --shard=${{ matrix.shard }}/4
