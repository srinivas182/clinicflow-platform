# Per-address request limit (slows URL-guessing bots before they reach the application).
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

server {
    listen 80;
    # HTTP/2 is negotiated by the TLS terminator (load balancer or the TLS server block added at deployment).
    server_name _;
    # Only the public/ folder is reachable; application code, .env, vendor and storage are outside it.
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 25m;
    limit_req_status 429;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compression: text responses (pages, JSON, scripts, styles) are sent compressed — typically 3–5x smaller.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf;
    # Pre-compressed files built by Vite (if present) are served directly.
    gzip_static on;

    # Keep file handles for static files warm.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_errors on;

    # Built assets have a content hash in their names: cache them for a year and never re-check.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Other static files (icons, fonts, images in public/): cache for a week.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        limit_req zone=perip burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller may run; any other .php file is never executed.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git, .htaccess…) — except .well-known for certificates.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Backups, archives, logs, database dumps and config files are never served.
    location ~* \.(zip|tar|gz|tgz|rar|7z|sql|sqlite|bak|old|orig|save|swp|log|ini|conf|env|sh|yml|yaml|lock|md)$ {
        deny all;
    }
}
